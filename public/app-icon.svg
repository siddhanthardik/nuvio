<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nuvio</title>
  <desc id="desc">Nuvio logo: modern healthcare cross and dynamic N monogram on a deep slate tile.</desc>

  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224" /></clipPath>

    <!-- Medical Teal to Cyan Gradient -->
    <linearGradient id="nuvio-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Emerald Teal Healthcare Gradient -->
    <linearGradient id="nuvio-teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Premium Deep Slate/Navy Background -->
    <rect width="1024" height="1024" fill="#0A1128" />

    <!-- Subtle Ambient Radial Glow -->
    <circle cx="512" cy="512" r="420" fill="#0D9488" opacity="0.12" filter="url(#soft-glow)" />

    <!-- Nuvio Medical Monogram: Harmonious "N" & Healthcare Cross -->
    <g transform="translate(16, 0)">
      <!-- Left Vertical Pillar of "N" -->
      <rect x="260" y="260" width="100" height="504" rx="50" fill="url(#nuvio-cyan)" />

      <!-- Right Vertical Pillar of "N" -->
      <rect x="632" y="260" width="100" height="504" rx="50" fill="url(#nuvio-teal)" />

      <!-- Diagonal Journey Ribbon (Patient Transit) connecting the pillars -->
      <path d="M 270 320 
               C 340 320, 560 670, 720 690 
               C 740 690, 740 640, 720 620 
               C 580 500, 360 260, 290 260 
               C 260 260, 260 320, 270 320 Z" 
            fill="#FFFFFF" opacity="0.95" />

      <!-- Central Healthcare Cross Emblem -->
      <!-- Horizontal Cross Bar -->
      <rect x="420" y="476" width="152" height="72" rx="36" fill="#FFFFFF" />
      <!-- Vertical Cross Bar -->
      <rect x="460" y="436" width="72" height="152" rx="36" fill="#FFFFFF" />
      
      <!-- Center Core Pulse Dot (Healthcare Focus) -->
      <circle cx="496" cy="512" r="16" fill="#06B6D4" />
    </g>
  </g>
</svg>
